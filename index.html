<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Spectrum Analyzer</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    background:
        radial-gradient(
            circle at top,
            #182033 0%,
            #080b12 55%,
            #05070b 100%
        );

    color: #ffffff;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;

    overflow: hidden;
}

/* ==============================
   全体
============================== */

.app {

    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;
}

/* ==============================
   ヘッダー
============================== */

header {

    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    border-bottom:
        1px solid rgba(255,255,255,0.08);

    background:
        rgba(8,11,18,0.82);

    backdrop-filter: blur(14px);
}

.logo {

    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
}

.logo span {
    opacity: 0.55;
}

.status {

    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 13px;
    color: #aeb8c9;
}

.status-dot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #626b7b;

    box-shadow:
        0 0 0 rgba(0,0,0,0);
}

.status-dot.active {

    background: #39ff9b;

    box-shadow:
        0 0 14px rgba(57,255,155,0.8);
}

/* ==============================
   メイン
============================== */

main {

    flex: 1;

    min-height: 0;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        310px;

    gap: 18px;

    padding: 18px;
}

/* ==============================
   グラフ
============================== */

.visualizer {

    min-width: 0;

    position: relative;

    border:
        1px solid rgba(255,255,255,0.08);

    border-radius: 18px;

    background:
        rgba(10,14,22,0.82);

    overflow: hidden;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.3);
}

.visualizer-title {

    position: absolute;

    top: 18px;
    left: 20px;

    z-index: 2;

    font-size: 12px;

    color: #7e8ba0;

    letter-spacing: 2px;
}

#spectrum {

    width: 100%;
    height: 100%;

    display: block;
}

/* ==============================
   サイド
============================== */

.sidebar {

    display: flex;
    flex-direction: column;

    gap: 14px;

    min-height: 0;
}

.card {

    border:
        1px solid rgba(255,255,255,0.08);

    border-radius: 16px;

    background:
        rgba(14,19,29,0.88);

    padding: 20px;

    box-shadow:
        0 12px 30px rgba(0,0,0,0.18);
}

.card-title {

    color: #758197;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 10px;
}

.big-number {

    font-size: 38px;

    font-weight: 800;

    line-height: 1;
}

.unit {

    color: #758197;

    font-size: 13px;
}

/* ==============================
   情報
============================== */

.info {

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.info-row {

    display: flex;
    justify-content: space-between;

    font-size: 13px;

    color: #9ba6b8;
}

.info-row strong {

    color: #ffffff;
}

/* ==============================
   ボタン
============================== */

.controls {

    display: flex;
    flex-direction: column;

    gap: 9px;
}

button {

    width: 100%;

    border: 0;

    border-radius: 10px;

    padding: 13px 12px;

    color: white;

    background: #20293a;

    cursor: pointer;

    font-size: 13px;

    transition:
        transform 0.15s,
        background 0.15s;
}

button:hover {

    background: #2b374d;

    transform: translateY(-1px);
}

button:active {

    transform: translateY(0);
}

button.start {

    background: #174e3a;
}

button.start:hover {

    background: #1d6549;
}

/* ==============================
   フッター
============================== */

.footer {

    margin-top: auto;

    color: #586476;

    font-size: 11px;

    text-align: center;

    padding-top: 3px;
}

/* ==============================
   レスポンシブ
============================== */

@media (max-width: 850px) {

    body {
        overflow: auto;
    }

    .app {
        min-height: 100vh;
        height: auto;
    }

    main {

        grid-template-columns: 1fr;

        height: auto;
    }

    .visualizer {

        height: 55vh;
        min-height: 400px;
    }

    .sidebar {

        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .controls {
        grid-column: 1 / -1;
    }

    .footer {
        padding-bottom: 10px;
    }
}

@media (max-width: 520px) {

    header {
        padding: 0 15px;
    }

    .logo {
        font-size: 17px;
    }

    main {
        padding: 10px;
    }

    .sidebar {
        grid-template-columns: 1fr;
    }

    .controls {
        grid-column: auto;
    }
}

</style>

</head>

<body>

<div class="app">

    <header>

        <div class="logo">
            〽 SPECTRUM <span>ANALYZER</span>
        </div>

        <div class="status">

            <div
                id="statusDot"
                class="status-dot"
            ></div>

            <span id="statusText">
                Pythonに接続中...
            </span>

        </div>

    </header>


    <main>

        <!-- グラフ -->

        <section class="visualizer">

            <div class="visualizer-title">
                REALTIME FREQUENCY
            </div>

            <canvas id="spectrum"></canvas>

        </section>


        <!-- サイドバー -->

        <aside class="sidebar">


            <!-- 音量 -->

            <div class="card">

                <div class="card-title">
                    AUDIO LEVEL
                </div>

                <div>
                    <span
                        id="level"
                        class="big-number"
                    >
                        -60
                    </span>

                    <span class="unit">
                        dB
                    </span>
                </div>

            </div>


            <!-- ピーク -->

            <div class="card">

                <div class="card-title">
                    PEAK FREQUENCY
                </div>

                <div>

                    <span
                        id="frequency"
                        class="big-number"
                    >
                        0
                    </span>

                    <span class="unit">
                        Hz
                    </span>

                </div>

            </div>


            <!-- 情報 -->

            <div class="card">

                <div class="card-title">
                    AUDIO INFO
                </div>

                <div class="info">

                    <div class="info-row">
                        <span>解析方式</span>
                        <strong>FFT</strong>
                    </div>

                    <div class="info-row">
                        <span>解析側</span>
                        <strong>Python</strong>
                    </div>

                    <div class="info-row">
                        <span>サンプルレート</span>
                        <strong id="sampleRate">
                            44100 Hz
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>FFTサイズ</span>
                        <strong>
                            4096
                        </strong>
                    </div>

                    <div class="info-row">
                        <span>接続</span>
                        <strong id="connection">
                            接続中
                        </strong>
                    </div>

                </div>

            </div>


            <!-- 操作 -->

            <div class="card controls">

                <div class="card-title">
                    CONTROL
                </div>

                <button
                    class="start"
                    onclick="startAnalyzer()"
                >
                    🎙 解析を開始
                </button>

                <button
                    onclick="clearGraph()"
                >
                    ✕ グラフをクリア
                </button>

            </div>


            <div class="footer">
                Python FFT Audio Analyzer
            </div>

        </aside>

    </main>

</div>


<script>

/* ==============================
   Canvas
============================== */

const canvas =
    document.getElementById("spectrum");

const ctx =
    canvas.getContext("2d");

let bars = new Array(128).fill(0);

let connected = false;


/* ==============================
   Canvasサイズ
============================== */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* ==============================
   グラフ描画
============================== */

function drawSpectrum() {

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* 背景 */

    ctx.fillStyle =
        "#090d15";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* グリッド */

    ctx.strokeStyle =
        "rgba(255,255,255,0.055)";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const y =
            70 +
            ((height - 110) / 8) * i;

        ctx.beginPath();

        ctx.moveTo(
            20,
            y
        );

        ctx.lineTo(
            width - 20,
            y
        );

        ctx.stroke();
    }


    /* 周波数ラベル */

    const labels = [
        "30Hz",
        "100Hz",
        "300Hz",
        "1kHz",
        "3kHz",
        "10kHz",
        "20kHz"
    ];

    ctx.font =
        "11px Arial";

    ctx.fillStyle =
        "#596579";


    labels.forEach(
        (label, index) => {

            const x =
                20 +
                ((width - 40) /
                (labels.length - 1))
                * index;

            ctx.fillText(
                label,
                x,
                height - 22
            );
        }
    );


    /* バー */

    const count =
        bars.length;

    const gap = 2;

    const barWidth =
        Math.max(
            1,
            (width - 40) / count - gap
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const value =
            bars[i] || 0;

        const maxHeight =
            height - 130;

        const barHeight =
            Math.max(
                2,
                (value / 100) *
                maxHeight
            );

        const x =
            20 +
            i *
            ((width - 40) / count);

        const y =
            height -
            50 -
            barHeight;


        /* グラデーション */

        const gradient =
            ctx.createLinearGradient(
                0,
                y,
                0,
                height - 50
            );

        gradient.addColorStop(
            0,
            "#ffffff"
        );

        gradient.addColorStop(
            0.35,
            "#72e5ff"
        );

        gradient.addColorStop(
            1,
            "#4169ff"
        );

        ctx.fillStyle =
            gradient;


        ctx.fillRect(
            x,
            y,
            barWidth,
            barHeight
        );
    }


    requestAnimationFrame(
        drawSpectrum
    );
}

drawSpectrum();


/* ==============================
   Python API
============================== */

async function updateData() {

    try {

        const response =
            await fetch(
                "/api/spectrum?t=" +
                Date.now()
            );

        if (!response.ok) {
            throw new Error(
                "Server error"
            );
        }

        const data =
            await response.json();


        connected = true;


        /* スペクトラム */

        if (
            Array.isArray(
                data.spectrum
            )
        ) {

            bars =
                data.spectrum;
        }


        /* 音量 */

        document
            .getElementById("level")
            .textContent =
            Number(
                data.level
            ).toFixed(1);


        /* 周波数 */

        let frequency =
            Number(
                data.frequency
            );


        if (frequency >= 1000) {

            document
                .getElementById(
                    "frequency"
                )
                .textContent =
                (frequency / 1000)
                .toFixed(2) + "k";

        } else {

            document
                .getElementById(
                    "frequency"
                )
                .textContent =
                Math.round(
                    frequency
                );
        }


        /* サンプルレート */

        document
            .getElementById(
                "sampleRate"
            )
            .textContent =
            data.sample_rate +
            " Hz";


        /* 接続状態 */

        document
            .getElementById(
                "connection"
            )
            .textContent =
            "Python接続中";


        document
            .getElementById(
                "statusText"
            )
            .textContent =
            "Python解析中";


        document
            .getElementById(
                "statusDot"
            )
            .classList
            .add("active");

    }

    catch (error) {

        connected = false;

        document
            .getElementById(
                "connection"
            )
            .textContent =
            "未接続";

        document
            .getElementById(
                "statusText"
            )
            .textContent =
            "Python未接続";

        document
            .getElementById(
                "statusDot"
            )
            .classList
            .remove("active");
    }
}


/* ==============================
   定期取得
============================== */

setInterval(
    updateData,
    50
);

updateData();


/* ==============================
   解析開始
============================== */

function startAnalyzer() {

    updateData();

}


/* ==============================
   グラフクリア
============================== */

function clearGraph() {

    bars =
        new Array(128).fill(0);

    document
        .getElementById("level")
        .textContent =
        "-60";

    document
        .getElementById("frequency")
        .textContent =
        "0";
}

</script>

</body>
</html>
